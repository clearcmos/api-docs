[project]
name = "external-docs-fetchers"
version = "0.0.0"
description = "Standalone fetchers that mirror vendor documentation to local Markdown"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.12",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
